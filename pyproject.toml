[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "escamanager"
version = "0.1.0"
description = "Gestion en ligne des adhésions du SCB Escalade — bibliothèque de domaine pure consommée par une application Django"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "Django>=5.2,<5.3",
    "dj-database-url>=2.2",
    "gunicorn>=23.0",
    "mysqlclient==2.3.0",
    "whitenoise>=6.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.9",
]

[tool.setuptools.packages.find]
include = ["domaine*", "application*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "application.config.settings"
pythonpath = ["."]
testpaths = ["tests"]
