[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "escamanager"
version = "0.1.0"
description = "Gestion en ligne des adhésions du SCB Escalade"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "Django>=5.2,<5.3",
    "dj-database-url>=2.2",
    "gunicorn>=23.0",
    "mysqlclient==2.3.0",
    "whitenoise>=6.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.9",
    "pytest-cov>=7.1",
    "ruff==0.17.6",
    "mypy>=2.4",
]

[tool.setuptools.packages.find]
include = ["domaine*", "application*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "application.config.settings"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
# Le code du projet vise Python 3.13 ; on exclut les répertoires sans code exécutable
target-version = "py313"
extend-exclude = ["_bmad", ".agents", "_bmad-output"]

[tool.ruff.lint.per-file-ignores]
# Les migrations sont générées par Django, personne ne
# les écrit à la main : RUF012 (défaut mutable d'attribut de classe) y est
# l'idiome standard.
"**/migrations/*" = ["RUF012"]

[tool.mypy]
# Typage strict uniquement pour le domaine
files = ["domaine"]
python_version = "3.13"
strict = true

[tool.coverage.report]
fail_under = 90
show_missing = true
