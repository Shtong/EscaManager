# Enfants convenus de l'épic, dans son dossier tickets/ ; tickets.py ignore les clés inconnues.
# L'ordre du tableau est l'ordre de construction. `id` est permanent, jamais réutilisé.

[[entry]]
id = 1
type = "story"
title = "Socle et première page en production"
description = "Dépôt vivant : pyproject, domaine/ en paquet pur avec sa première lecture (une requête du domaine, son dépôt via l'ORM, jusqu'à MySQL) servie par la page d'accueil, CI GitHub Actions (tests du domaine sans base, application sur MySQL), déploiement Scalingo neutre (WSGI standard, variables d'environnement). Une étape humaine crée le dépôt GitHub, le compte Scalingo, l'application, sa base MySQL et le compte Brevo du club (courriels transactionnels, offre gratuite)."
verify = "Le site répond à l'adresse de production et la CI du dépôt est verte ; un test d'imports garantit que domaine/ n'importe rien d'extérieur."
covers = ["R4", "R5"]
after = []
hitl = true
risk = "medium"

[[entry]]
id = 2
type = "story"
title = "Comptes : inscription confirmée, connexion, réinitialisation"
description = "Le parcours des comptes sur django.contrib.auth adapté au domaine : création de compte avec courriel de confirmation envoyé par le SMTP du club, connexion, déconnexion, réinitialisation du mot de passe, espace personnel minimal qui prépare les entrées suivantes (données personnelles, effacement)."
verify = "Un visiteur crée un compte, le confirme par courriel, se connecte et voit son espace ; il se déconnecte et n'y a plus accès ; la réinitialisation fonctionne ; le parcours est utilisable sur mobile comme sur ordinateur."
covers = ["R1"]
after = [1]
hitl = false
risk = "low"

